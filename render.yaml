# Render Blueprint for the SEN371 API.
#
# This file exists so the build command, start command and health check path
# are version-controlled rather than living only in the Render dashboard,
# where they are invisible to a marker and lost if the service is recreated.
# Render reads it when the service is created from a Blueprint ("New >
# Blueprint" in the dashboard); changing it afterwards does not retroactively
# reconfigure a service that was created by hand, so if the service already
# exists, make the dashboard match this file.
#
# Deploys themselves are triggered by .github/workflows/deploy-server.yml.

services:
  - type: web
    name: sen371-boardgame-store-api
    runtime: node
    plan: free
    # Frankfurt is the closest Render region to South Africa. The production
    # Neon database should sit in the same region — a cross-continent hop
    # between the API and its database adds latency to every single query,
    # which is far more costly than the one-off hop from the browser.
    region: frankfurt
    rootDir: server

    # prisma generate is required because node_modules is not committed and
    # the generated client is not in the repo. migrate deploy (not migrate
    # dev) applies pending migrations without ever prompting or resetting —
    # the only safe form against a production database.
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start

    # Liveness, not readiness. Render restarts the instance when this fails,
    # and restarting the API cannot repair an unreachable database — it would
    # take the API down too and mask the real fault. Readiness lives at
    # /api/v1/health/ready and is what the uptime monitor watches.
    healthCheckPath: /api/v1/health

    # Deploys come from the GitHub workflow, not from Render watching the
    # repository. Render's own auto-deploy cannot filter by path, so it would
    # rebuild and restart the API for every client-only or docs-only commit,
    # each one costing a free-tier cold start for no change to the API.
    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: production

      # sync: false means "prompt for this and store it in Render, never in
      # this file". Every secret and every environment-specific URL is set in
      # the Render dashboard; see the deployment section of README.md.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d

    # PORT is deliberately absent. Render assigns it and the process must bind
    # to whatever it assigns; src/config/index.js already reads process.env.PORT
    # with a 3000 fallback for local development. Hardcoding it here would make
    # the service unreachable and the failure looks like a health check
    # timeout, which is a slow thing to diagnose.
