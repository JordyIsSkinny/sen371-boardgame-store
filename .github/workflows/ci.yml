name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: server
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sen371_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sen371_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate

      - name: Run database migrations
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sen371_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sen371_test
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sen371_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sen371_test
        run: node ./node_modules/vitest/vitest.mjs run

      - name: Run tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sen371_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sen371_test
          NODE_ENV: test
          PORT: 3000
          CLIENT_ORIGIN: http://localhost:5173
          JWT_SECRET: test-jwt-secret
          REFRESH_TOKEN_SECRET: test-refresh-secret
          JWT_EXPIRES_IN: 15m
          REFRESH_TOKEN_EXPIRES_IN: 7d
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate